name: export data

on:
  workflow_dispatch:
  push:
    branches: [ "develop" ]
  schedule:
    - cron: 20 */4 * * *

env:
  NODE_OPTIONS: "--max_old_space_size=16000"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v3
      - name: install node
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: npm install
        run: npm ci
      - name: read local version
        id: local-version
        run: |
          echo "poe1=$(cat version.txt)" >> "$GITHUB_OUTPUT"
          echo "poe2=$(cat version2.txt)" >> "$GITHUB_OUTPUT"
          echo "schema=$(cat schema.txt)" >> "$GITHUB_OUTPUT"
      - name: get version
        id: get-version
        run: |
          POE1=$(curl --fail 'https://ggpk.exposed/version?poe=1' | sed -r 's|.*/([0-9](\.[0-9]+)+)/$|\1|')
          POE2=$(curl --fail 'https://ggpk.exposed/version?poe=2' | sed -r 's|.*/([0-9](\.[0-9]+)+)/$|\1|')
          git ls-remote https://github.com/poe-tool-dev/dat-schema.git refs/heads/main > schema.txt
          echo "schema=$(cat schema.txt)" >> "$GITHUB_OUTPUT"
          echo "poe1=$POE1" >> "$GITHUB_OUTPUT"
          echo "poe2=$POE2" >> "$GITHUB_OUTPUT"
          echo "version=$POE1 / $POE2" >> "$GITHUB_OUTPUT"
      - name: cache cdn downloads
        uses: actions/cache@v3
        with:
          path: .cache
          key: poecdn-${{ steps.get-version.outputs.version }}

      - name: validate poe1
        if: >
          github.event_name != 'schedule' ||
          steps.get-version.outputs.poe1 != steps.local-version.outputs.poe1 ||
          steps.get-version.outputs.schema != steps.local-version.outputs.schema
        run: npx -y tsx src/validate.ts --quiet
      - name: validate poe2
        if: >
          github.event_name != 'schedule' ||
          steps.get-version.outputs.poe2 != steps.local-version.outputs.poe2 ||
          steps.get-version.outputs.schema != steps.local-version.outputs.schema
        run: npx -y tsx src/validate.ts --poe2 --quiet
      - name: remove large csv files
        run: find * -name '*.csv' -size +50M -print -delete # usually an error in the heuristic
      - name: prepare sqlite files
        run: |
          [ -f current/poe/dat.sqlite ] || curl --fail -L https://repoe-fork.github.io/dat-export/poe/dat.sqlite -o current/poe/dat.sqlite
          [ -f current/poe2/dat.sqlite ] || curl --fail -L https://repoe-fork.github.io/dat-export/poe2/dat.sqlite -o current/poe2/dat.sqlite
          for i in current/*/dat.sqlite; do split -db 10m "$i" "$i".; done
          for i in current/*/dat.sqlite; do stat --format='{"size":%s,"created":%W}' "$i" > "$i.json"; done

      - name: commit changes
        id: autocommit
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "export data at version ${{ steps.get-version.outputs.version }}"
      - name: upload gh-pages artifact
        if: github.event_name != 'schedule' || steps.autocommit.outputs.changes_detected == 'true'
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: current

    outputs:
      changes_detected: ${{ steps.autocommit.outputs.changes_detected }}

  deploy:
    runs-on: ubuntu-latest

    needs: build
    if: github.event_name != 'schedule' || needs.build.outputs.changes_detected == 'true'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: deploy gh-pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
