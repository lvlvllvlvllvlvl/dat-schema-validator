name: Validate schema

on:
  workflow_dispatch:
  push:
    branches: ["develop"]
  schedule:
    - cron: "0 0 * * *"

env:
  NODE_OPTIONS: "--max_old_space_size=16000"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v3
      - name: install node
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: npm install
        run: npm i
      - name: get version
        id: get-version
        run: echo "version=$(curl --fail 'https://ggpk.exposed/version?poe=1' | sed -r 's|.*/([0-9](\.[0-9]+)+)/$|\1|') / $(curl --fail 'https://ggpk.exposed/version?poe=2' | sed -r 's|.*/([0-9](\.[0-9]+)+)/$|\1|')" >> "$GITHUB_OUTPUT"
      - name: cache cdn downloads
        uses: actions/cache@v3
        with:
          path: .cache
          key: poecdn-${{ steps.get-version.outputs.version }}
      - name: validate schema
        run: npx -y tsx src/validate.ts --quiet
      - name: validate poe2 schema
        run: npx -y tsx src/validate.ts --poe2 --quiet
      - name: commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "validate schema at version ${{ steps.get-version.outputs.version }}"
