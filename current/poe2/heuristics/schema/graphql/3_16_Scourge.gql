type HellscapeAOReplacements {
  Original: string @file(ext: ".ao")
  HASH32: i32
  Replacement: string @file(ext: ".ao")
}

enum HellscapeAreaPacks @indexing(first: 0) { _ }

type HellscapeExperienceLevels {
  Level: i32
  Experience: i32
}

enum HellscapeFactions @indexing(first: 0) { _ }

type HellscapeImmuneMonsters {
  Monster: MonsterVarieties
}

type HellscapeItemModificationTiers {
  Tier: i32
  IsMap: bool
  _: i32
  MinItemLvl: i32
}

type HellscapeLifeScalingPerLevel {
  AreaLevel: i32
  Scale: i32
}

type HellscapeModificationInventoryLayout {
  Id: string @unique
  Column: i32
  Row: i32
  IsMapSlot: bool
  _: i32
  Width: i32
  Height: i32
  Stat: Stats
  StatValue: i32
  UnlockedWith: HellscapePassives
  Quest: Quest
}

enum HellscapeMods @indexing(first: 0) { _ }

enum HellscapeMonsterPacks @indexing(first: 0) { _ }

type HellscapePassives {
  Id: string @unique
  Name: string @localized
  Stats: [Stats]
  StatsValues: [i32]
  Points: i32
  HASH16: i32
  Icon: string
  IconMaxed: string
  SoundEffect: SoundEffects
  _: i32
  Quest: Quest
}

type HellscapePassiveTree {
  Id: string @unique
  AllocationsRequired: i32
  Passives: [HellscapePassives]
}
