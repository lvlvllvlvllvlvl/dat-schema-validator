# Added 3.11
type Stats @tags(list: ["crafting"]) {
  Id: string @unique
  "Sends changes to registered external stat listeners"
  IsPublic: bool
  IsLocal: bool
  IsWeaponLocal: bool
  Semantics: StatSemantics
  "Routes changes into the party-visible stat update list"
  IsParty: bool
  IsVirtual: bool
  MainHandAlias_StatsKey: Stats
  OffHandAlias_StatsKey: Stats
  "Propagates changes into child or layered stat containers for recalculation"
  IsProxied: bool
  HASH32: u32
  BelongsActiveSkillsKey: [ActiveSkills] @ref(column: "Id")
  Category: PassiveSkillStatCategories
  _: bool
  "Marks stats that are registered by ApplyDamageFunctions"
  IsApplyDamageFunctionStat: bool
  IsScalable: bool
  ContextFlags: [VirtualStatContextFlags]
  DotFlag: [VirtualStatContextFlags]
}
